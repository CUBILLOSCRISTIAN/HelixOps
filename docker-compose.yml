version: "3.9"

services:
  postgres:
    image: postgres:16
    container_name: helixops-postgres
    environment:
      POSTGRES_USER: helixops
      POSTGRES_PASSWORD: helixops
      POSTGRES_DB: helixops
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  rabbitmq:
    image: rabbitmq:3-management
    container_name: helixops-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"

volumes:
  pgdata:
